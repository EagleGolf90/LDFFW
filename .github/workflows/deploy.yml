name: 🚀 Deploy LDFFW to FullTimberStack

on:
  push:
    branches:
      - main
      - develop

jobs:
  ftp-deploy:
    name: 📂 Upload via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # .env is gitignored, so build it from repo secrets for api/lineup.php
      # (MySQL credentials for the users_lineup table).
      - name: Write production .env
        run: |
          cat > .env <<'EOF'
          DB_HOST=${{ secrets.DB_HOST }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_PORT=${{ secrets.DB_PORT }}
          EOF

      - name: Deploy to FullTimberStack
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: kdga/ldffw/
          # Keep the defaults, plus never upload/delete the live lineup data
          # on the production server — it seeds the one-time users_lineup
          # table migration and is the fallback when MySQL is unreachable.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            data/users_lineup.json