name: 🚀 Deploy LDFFW to FullTimberStack

on:
  push:
    branches:
      - main
      - develop

jobs:
  ftp-deploy:
    name: 📂 Upload via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to FullTimberStack
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: kdga/ldffw/
          # Keep the defaults, plus never upload/delete the live lineup data
          # that api/lineup.php writes on the production server.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            data/users_lineup.json